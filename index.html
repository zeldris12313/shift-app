<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三人輪班更期對照與推算系統</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --off-bg: #ffeaa7;
      --night-bg: #dfe6e9;
      --today-highlight: #fdcb6e;
      --calc-highlight: #a29bfe;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f8f9fa;
      color: #333;
    }
    h1 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.5rem;
      margin-bottom: 15px;
    }
    .status-bar {
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      text-align: center;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .person-card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.08);
      border-top: 5px solid var(--accent-color);
    }
    .person-card:nth-child(2) { border-top-color: #e84393; }
    .person-card:nth-child(3) { border-top-color: #00b894; }
    
    .person-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .person-name {
      font-size: 1.3rem;
      font-weight: bold;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    select, input[type="number"], input[type="date"] {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 0.85rem;
      background: #fdfdfd;
    }

    /* 推算工具區塊 */
    .calc-box {
      background: #f1f2f6;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.85rem;
    }
    .calc-box button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .calc-box button:hover {
      opacity: 0.9;
    }
    .calc-result {
      background: #eef2f7;
      padding: 8px 12px;
      border-left: 4px solid var(--accent-color);
      border-radius: 4px;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.85rem;
    }
    th, td {
      padding: 8px 4px;
      border: 1px solid #e0e0e0;
    }
    th {
      background-color: #f1f2f6;
      color: #57606f;
    }
    .row-active {
      background-color: #e3f2fd;
      font-weight: bold;
    }
    .cell-today {
      background-color: var(--today-highlight) !important;
      border: 2px solid #e1701a !important;
      font-weight: bold;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
    }
    .cell-today::after {
      content: " ★今日";
      font-size: 0.65rem;
      color: #d63031;
      display: block;
    }
    .cell-target {
      background-color: var(--calc-highlight) !important;
      color: white !important;
      border: 2px solid #6c5ce7 !important;
      font-weight: bold;
    }
    .cell-target::after {
      content: " 🎯推算日";
      font-size: 0.65rem;
      color: #fff;
      display: block;
    }
    .shift-off {
      background-color: var(--off-bg);
      color: #d63031;
    }
    .shift-night {
      background-color: var(--night-bg);
    }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBR6sSm99LLA7k7x6bzqMRsKHP7lBLNnnM",
      authDomain: "three-mum.firebaseapp.com",
      projectId: "three-mum",
      storageBucket: "three-mum.firebasestorage.app",
      messagingSenderId: "759414785710",
      appId: "1:759414785710:web:6ae6f93040be6325898f3f",
      measurementId: "G-QFKQMNB71B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ROSTERS = {
      group2: {
        name: "2組 (12行)",
        totalRows: 12,
        data: [
          ["N (10-8)", "R", "W", "1-11", "1-9", "9-6", "9-4"],
          ["9-5", "N (10-8)", "R", "W", "1-11", "1-9", "9-5"],
          ["9-5", "9-5", "1-9", "9-5", "9-5", "9-1", "W"],
          ["8-4", "9-5", "N (10-8)", "R", "W", "1-11", "1-9"],
          ["9-6", "8-4", "9-4", "N (10-8)", "R", "W", "1-11"],
          ["1-9", "9-6", "8-4", "9-5", "4-11", "W", "9-1"],
          ["3-11", "9-5", "9-6", "9-6", "N (10-8)", "R", "W"],
          ["8-4", "8-4", "8-4", "8-4", "8-4", "9-1", "W"],
          ["1-11", "1-9", "W", "8-5", "9-4", "N (10-8)", "R"],
          ["W", "1-11", "5-10", "9-1", "8-4", "9-4", "N (10-8)"],
          ["R", "W", "1-11", "1-9", "9-6", "8-5", "8-4"],
          ["W", "1-9", "1-9", "9-4", "9-1", "8-5", "8-4"]
        ]
      },
      group3: {
        name: "3組 (14行)",
        totalRows: 14,
        data: [
          ["N (10-8)", "R", "W", "9-5", "9-5", "1-11", "2-10"],
          ["W", "9-6", "8-5", "9-5", "1-10", "1-10", "W"],
          ["9-6", "2-10", "1-11", "N (10-8)", "R", "W", "9-4"],
          ["9-4", "9-5", "8-4", "9-1", "8-5", "9-5", "W"],
          ["1-10", "N (10-8)", "R", "W", "8-4", "8-5", "9-5"],
          ["9-5", "3-11", "3-11", "W", "8-4", "9-5", "9-1"],
          ["4-11", "1-11", "N (10-8)", "R", "W", "9-6", "9-5"],
          ["9-6", "8-1", "9-4", "3-11", "1-11", "W", "8-1"],
          ["8-4", "9-6", "10-5", "1-11", "N (10-8)", "R", "W"],
          ["2-11", "3-10", "9-1", "9-6", "8-4", "9-4", "W"],
          ["9-5", "9-4", "9-6", "W", "1-11", "N (10-8)", "R"],
          ["W", "8-4", "9-4", "9-5", "9-4", "8-4", "4-10"],
          ["1-10", "W", "9-4", "9-4", "10-5", "9-1", "N (10-8)"],
          ["R", "W", "8-4", "8-4", "9-6", "1-10", "1-11"]
        ]
      },
      group4: {
        name: "4組 (5行)",
        totalRows: 5,
        data: [
          ["8-1", "9-4", "9-5", "8-4", "W", "4-11", "1-10"],
          ["9-5", "9-5", "9-5", "2-10", "9-1", "W", "8-4"],
          ["9-4", "8-1", "W", "8-4", "9-5", "1-11", "5-11"],
          ["10-5", "9-1", "1-11", "5-11", "W", "9-6", "9-5"],
          ["8-4", "10-5", "9-6", "1-11", "4-10", "9-1", "W"]
        ]
      }
    };

    let membersState = {
      sasa: { group: 'group2', currentRow: 1, calcDays: 0, calcDate: '', resultText: '' },
      kit: { group: 'group3', currentRow: 1, calcDays: 0, calcDate: '', resultText: '' },
      sister: { group: 'group4', currentRow: 1, calcDays: 0, calcDate: '', resultText: '' }
    };

    // 取得今天 (0=MON ... 6=SUN)
    function getTodayIndex() {
      const day = new Date().getDay();
      return day === 0 ? 6 : day - 1;
    }

    const todayIndex = getTodayIndex();
    const dayNames = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

    // 核心推算算法
    function calculateFutureShift(baseRow, totalRows, addDays) {
      const todayIdx = getTodayIndex();
      
      // 計算相隔的週數與星期幾
      const totalDayOffset = todayIdx + addDays;
      
      // 目標星期幾 (0~6)
      let targetDayIdx = totalDayOffset % 7;
      if (targetDayIdx < 0) targetDayIdx += 7;

      // 移動了幾多個星期 (向下移動幾多行)
      const weekOffset = Math.floor(totalDayOffset / 7);

      // 計算目標行數 (1~totalRows)
      let targetRow = ((baseRow - 1 + weekOffset) % totalRows) + 1;
      if (targetRow <= 0) targetRow += totalRows;

      return { targetRow, targetDayIdx };
    }

    // 渲染 UI
    function renderApp() {
      const container = document.getElementById('app');
      container.innerHTML = '';

      const memberNames = { sasa: 'sasa', kit: 'kit', sister: '姐姐' };

      Object.keys(membersState).forEach(id => {
        const member = membersState[id];
        const roster = ROSTERS[member.group];

        // 算出推算位置（如果有設定推算）
        let targetPos = null;
        if (member.calcDays !== undefined && member.calcDays !== 0) {
          targetPos = calculateFutureShift(member.currentRow, roster.totalRows, member.calcDays);
        }

        let html = `
          <div class="person-card">
            <div class="person-header">
              <div class="person-name">${memberNames[id]}</div>
              <div class="controls">
                <label>組別：</label>
                <select onchange="updateMember('${id}', 'group', this.value)">
                  <option value="group2" ${member.group === 'group2' ? 'selected' : ''}>2組 (12行)</option>
                  <option value="group3" ${member.group === 'group3' ? 'selected' : ''}>3組 (14行)</option>
                  <option value="group4" ${member.group === 'group4' ? 'selected' : ''}>4組 (5行)</option>
                </select>
                
                <label>本週處於：</label>
                <select onchange="updateMember('${id}', 'currentRow', parseInt(this.value))">
        `;

        for (let i = 1; i <= roster.totalRows; i++) {
          html += `<option value="${i}" ${member.currentRow === i ? 'selected' : ''}>第 ${i} 行</option>`;
        }

        html += `
                </select>
              </div>
            </div>

            <!-- 推算功能區塊 -->
            <div class="calc-box">
              <span><b>🔍 更期推算：</b></span>
              <label>相隔日數：</label>
              <input type="number" id="days_input_${id}" placeholder="如 2 或 -3" style="width:70px;" value="${member.calcDays || ''}">
              <button onclick="calcByDays('${id}')">按日數推算</button>
              
              <span style="color:#ccc;">|</span>
              
              <label>或 指定日期：</label>
              <input type="date" id="date_input_${id}" value="${member.calcDate || ''}">
              <button onclick="calcByDate('${id}')">按日期推算</button>
              
              ${member.calcDays ? `<button style="background:#e74c3c;" onclick="resetCalc('${id}')">清除推算</button>` : ''}
            </div>

            ${member.resultText ? `<div class="calc-result">💡 <b>推算結果：</b> ${member.resultText}</div>` : ''}

            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>行數</th>
                    <th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th><th>SUN</th>
                  </tr>
                </thead>
                <tbody>
        `;

        roster.data.forEach((row, idx) => {
          const rowNum = idx + 1;
          const isActiveRow = rowNum === member.currentRow;
          html += `<tr class="${isActiveRow ? 'row-active' : ''}">`;
          html += `<td><b>第 ${rowNum} 行</b></td>`;

          row.forEach((shift, dayIdx) => {
            const isToday = isActiveRow && dayIdx === todayIndex;
            const isTarget = targetPos && rowNum === targetPos.targetRow && dayIdx === targetPos.targetDayIdx;

            let classList = [];
            if (isToday) classList.push('cell-today');
            if (isTarget) classList.push('cell-target');
            if (shift === 'W' || shift === 'R') classList.push('shift-off');
            if (shift.startsWith('N')) classList.push('shift-night');

            html += `<td class="${classList.join(' ')}">${shift}</td>`;
          });

          html += `</tr>`;
        });

        html += `
                </tbody>
              </table>
            </div>
          </div>
        `;

        container.innerHTML += html;
      });
    }

    // 按日數推算
    window.calcByDays = (id) => {
      const input = document.getElementById(`days_input_${id}`);
      const days = parseInt(input.value);
      if (isNaN(days)) return;

      const roster = ROSTERS[membersState[id].group];
      const res = calculateFutureShift(membersState[id].currentRow, roster.totalRows, days);
      const shift = roster.data[res.targetRow - 1][res.targetDayIdx];

      membersState[id].calcDays = days;
      membersState[id].calcDate = '';
      membersState[id].resultText = `${days >= 0 ? days + ' 天後' : Math.abs(days) + ' 天前'}（第 ${res.targetRow} 行 ${dayNames[res.targetDayIdx]}）班次為：<b style="color:#d63031;font-size:1.1rem;">${shift}</b>`;
      
      saveAndRender();
    };

    // 按指定日期推算
    window.calcByDate = (id) => {
      const dateInput = document.getElementById(`date_input_${id}`).value;
      if (!dateInput) return;

      const targetDate = new Date(dateInput);
      const today = new Date();
      
      // 清除時間差部分，只算天數
      today.setHours(0,0,0,0);
      targetDate.setHours(0,0,0,0);

      const diffTime = targetDate - today;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      const roster = ROSTERS[membersState[id].group];
      const res = calculateFutureShift(membersState[id].currentRow, roster.totalRows, diffDays);
      const shift = roster.data[res.targetRow - 1][res.targetDayIdx];

      membersState[id].calcDays = diffDays;
      membersState[id].calcDate = dateInput;
      membersState[id].resultText = `日期 ${dateInput}（${diffDays >= 0 ? diffDays + ' 天後' : Math.abs(diffDays) + ' 天前'}，第 ${res.targetRow} 行 ${dayNames[res.targetDayIdx]}）班次為：<b style="color:#d63031;font-size:1.1rem;">${shift}</b>`;

      saveAndRender();
    };

    // 清除推算高亮
    window.resetCalc = (id) => {
      membersState[id].calcDays = 0;
      membersState[id].calcDate = '';
      membersState[id].resultText = '';
      saveAndRender();
    };

    async function saveAndRender() {
      renderApp();
      try {
        await setDoc(doc(db, "roster_config", "current"), membersState);
      } catch (e) { console.error(e); }
    }

    window.updateMember = async (id, key, value) => {
      membersState[id][key] = value;
      if (key === 'group') membersState[id].currentRow = 1;
      saveAndRender();
    };

    onSnapshot(doc(db, "roster_config", "current"), (docSnap) => {
      if (docSnap.exists()) {
        membersState = docSnap.data();
        renderApp();
      } else {
        renderApp();
      }
    });

  </script>
</head>
<body>

  <h1>三人輪班更期對照與推算系統</h1>
  <div class="status-bar">
    💡 標示說明：<span style="background-color: var(--today-highlight); padding: 2px 6px; border-radius: 4px; font-weight: bold;">黃框 ★今日</span> | 
    <span style="background-color: var(--calc-highlight); color:white; padding: 2px 6px; border-radius: 4px; font-weight: bold;">紫框 🎯推算日</span>
  </div>

  <div id="app">載入中...</div>

</body>
</html>
