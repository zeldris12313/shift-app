<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>多人輪班更期對照與撞假食飯推算系統</title>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #e67e22;
      --card-border: #2ecc71;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 10px;
      background-color: #f8fafc;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .page-title {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2c3e50;
      margin: 4px 0 10px 0;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 8px;
    }
    .tab-btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid #cbd5e0;
      color: #4a5568;
      background: #f7fafc;
    }
    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* 頂部比對卡片 */
    .compare-section {
      background: white;
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .compare-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: #27ae60;
      margin-bottom: 6px;
    }

    /* 點心紙篩選區 */
    .dimsum-card {
      background: #fffdf9;
      border: 1.5px solid #fbd38d;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 0.82rem;
    }
    .dimsum-title {
      font-weight: bold;
      color: #c05621;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dimsum-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 6px;
      margin-bottom: 8px;
    }
    .dimsum-item {
      display: flex;
      align-items: center;
      gap: 4px;
      background: white;
      border: 1px solid #fed7d7;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .dimsum-threshold-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px dashed #fbd38d;
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 480px;
      overflow-y: auto;
    }
    .match-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
    }
    .match-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .match-date { font-size: 0.9rem; font-weight: bold; }
    .match-badge {
      background: #3182ce;
      color: white;
      font-size: 0.68rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .match-summary-text { font-size: 0.82rem; font-weight: bold; margin-bottom: 3px; color: #27ae60; }
    .match-shifts-row {
      font-size: 0.75rem;
      color: #4a5568;
      background: #f7fafc;
      padding: 4px 6px;
      border-radius: 4px;
      line-height: 1.35;
    }

    /* 成員卡片 */
    .member-box {
      background: #ffffff;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .member-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .member-name-input {
      font-size: 0.95rem;
      font-weight: bold;
      border: 1px solid #cbd5e0;
      border-radius: 5px;
      padding: 2px 6px;
      width: 105px;
    }
    .field-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.8rem;
      margin-bottom: 5px;
    }
    .custom-date-box {
      background: #ebf8ff;
      border: 1px dashed #bee3f8;
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 5px;
    }
    .known-vacation-box {
      background: #f0fff4;
      border: 1px dashed #9ae6b4;
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    select, input[type="date"], input[type="number"] {
      padding: 3px 5px;
      border-radius: 4px;
      border: 1px solid #cbd5e0;
      font-size: 0.8rem;
    }

    .member-collapse-btn {
      width: 100%;
      background: #edf2f7;
      color: #4a5568;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 月曆 */
    .cal-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #edf2f7;
      padding: 6px 10px;
      border-radius: 8px;
      margin: 15px 0 8px;
    }
    .month-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: center;
      font-size: 0.72rem;
    }
    .month-table th { background: #f1f2f6; padding: 4px 1px; }
    .month-table td {
      border: 1px solid #eee;
      height: 52px;
      vertical-align: top;
      padding: 2px 1px;
      cursor: pointer;
    }
    .month-table td:active { background: #edf2f7; }
    .cal-match-bg {
      background: #e8f8f5 !important;
      border: 1.5px solid #27ae60 !important;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal-card {
      background: white;
      border-radius: 12px;
      width: 88%;
      max-width: 330px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      text-align: left;
    }
  </style>
</head>
<body>

    <div class="container">
    <!-- 頂部頁面切換導航與快捷重新整理 -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:2px solid #edf2f7; padding-bottom:8px; flex-wrap:wrap; gap:6px;">
      <div class="nav-tabs" style="margin-bottom:0; border-bottom:none; padding-bottom:0;">
        <a href="calc.html" class="tab-btn">📅 個人更期與PH計算</a>
        <a href="dinner.html" class="tab-btn active">🍽️ 多人約食飯／撞假對照</a>
      </div>
      <button onclick="location.reload()" style="background:#34495e; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:0.75rem; cursor:pointer; font-weight:bold;">🔄 重新整理 (Refresh)</button>
    </div>

    <!-- 提示框：手機加至主畫面 App -->
    <div style="background:#e8f4fd; border-left:4px solid #3498db; padding:6px 10px; margin-bottom:10px; border-radius:4px; font-size:0.8rem; color:#2980b9; line-height:1.4;">
      📲 <b>手機安裝技巧：</b>在手機瀏覽器點擊下方「<b>分享</b>」圖示，然後選擇「<b>加至主畫面 (Add to Home Screen)</b>」，即可當作獨立 App 隨時點開使用！
    </div>

    <div class="page-title">多人輪班更期對照與推算系統</div>

    <!-- 頂部：撞假 / 食飯交叉比對 -->
    <div class="compare-section">
      <div class="compare-title">📅 多人撞假 / 食飯時間交叉比對</div>
      
      <!-- 點心紙篩選面板 -->
      <div class="dimsum-card">
        <div class="dimsum-title">
          <span>📜 食飯點心紙（勾選當次聚會可接受之班次）：</span>
          <span style="font-size:0.75rem; color:#718096;">
            範圍：
            <select id="rangeDays" onchange="renderAll()" style="font-size:0.75rem;">
              <option value="30">未來 30 天</option>
              <option value="60">未來 60 天</option>
              <option value="90">未來 90 天</option>
            </select>
          </span>
        </div>

        <div class="dimsum-grid">
          <label class="dimsum-item">
            <input type="checkbox" id="shift_w" checked onchange="renderAll()">
            <span>🌴 純放假 (W/AL)</span>
          </label>
          <label class="dimsum-item">
            <input type="checkbox" id="shift_r" onchange="renderAll()">
            <span>💤 通宵收工 (R)</span>
          </label>
          <label class="dimsum-item">
            <input type="checkbox" id="shift_half" checked onchange="renderAll()">
            <span>🌤️ 半日早班 (8/9-1)</span>
          </label>
          <label class="dimsum-item">
            <input type="checkbox" id="shift_early" checked onchange="renderAll()">
            <span>🌅 標準早更 (4-6點收)</span>
          </label>
          <label class="dimsum-item">
            <input type="checkbox" id="shift_p" onchange="renderAll()">
            <span>🌆 P更 / 中更 (1點起)</span>
          </label>
          <label class="dimsum-item">
            <input type="checkbox" id="shift_n" onchange="renderAll()">
            <span>🌙 返通宵 (N 10-8)</span>
          </label>
        </div>

        <div class="dimsum-threshold-row">
          <span><b>門檻要求：</b></span>
          <label style="cursor:pointer;">
            <input type="radio" name="thresholdMode" value="half" checked onchange="renderAll()"> 過半數人符合
          </label>
          <label style="cursor:pointer; display:flex; align-items:center; gap:4px;">
            <input type="radio" name="thresholdMode" value="custom" onchange="renderAll()">
            <span>至少</span>
            <input type="number" id="customThresholdNum" value="3" min="1" max="10" style="width:45px;" onchange="renderAll()">
            <span>人符合</span>
          </label>
          <span style="font-size:0.75rem; color:#718096; margin-left:auto;" id="thresholdNotice"></span>
        </div>
      </div>

      <div class="match-list" id="matchList"></div>
    </div>

    <!-- 成員設定區 (前3位常開，4至10逐個折疊) -->
    <div id="membersContainer"></div>

    <!-- 底部月曆 -->
    <div class="cal-controls">
      <button onclick="navMonth(-1)" style="border:none; background:#2c3e50; color:white; padding:4px 8px; border-radius:4px; cursor:pointer;">◀ 上月</button>
      <div style="font-weight:bold; color:#2c3e50;" id="calTitle"></div>
      <button onclick="navMonth(1)" style="border:none; background:#2c3e50; color:white; padding:4px 8px; border-radius:4px; cursor:pointer;">下月 ▶</button>
    </div>
    <div style="font-size:0.72rem; color:#718096; margin-bottom:4px;">💡 提示：點擊月曆任一日，即可彈出查看當天所有同事的完整更期及名單。</div>
        <div style="overflow-x:auto;">
      <table class="month-table">
        <thead>
          <tr><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th><th>SUN</th></tr>
        </thead>
        <tbody id="calTableBody"></tbody>
      </table>
    </div>

    <!-- 底部快捷重新整理 -->
    <div style="text-align:center; margin-top:16px; padding:8px 0;">
      <button onclick="location.reload()" style="background:#34495e; color:white; border:none; padding:8px 18px; border-radius:6px; font-size:0.85rem; cursor:pointer; font-weight:bold;">🔄 重新整理頁面 (Refresh)</button>
    </div>

  </div>

  <!-- 點擊月曆詳細資料彈窗 -->
  <div class="modal-overlay" id="calDetailModal">
    <div class="modal-card">
      <h3 style="margin-top:0; color:#2c3e50; font-size:1rem; border-bottom:1px solid #edf2f7; padding-bottom:6px;" id="modalCalDate">當天詳細更期</h3>
      <div id="modalCalSummary" style="font-size:0.85rem; font-weight:bold; margin-bottom:10px;"></div>
      <div id="modalCalList" style="font-size:0.8rem; background:#f7fafc; padding:8px; border-radius:6px; line-height:1.6; max-height:260px; overflow-y:auto;"></div>
      <button onclick="closeCalModal()" style="width:100%; margin-top:12px; background:#2c3e50; color:white; border:none; padding:7px; border-radius:6px; cursor:pointer; font-weight:bold;">關閉</button>
    </div>
  </div>

  <script>
    const ROSTERS = {
      group2: {
        name: "2組 (12行)",
        totalRows: 12,
        data: [
          ["N (10-8)", "R", "W", "1-11", "1-9", "9-6", "9-4"],
          ["9-5", "N (10-8)", "R", "W", "1-11", "1-9", "9-5"],
          ["9-5", "9-5", "1-9", "9-5", "9-5", "9-1", "W"],
          ["8-4", "9-5", "N (10-8)", "R", "W", "1-11", "1-9"],
          ["9-6", "8-4", "9-4", "N (10-8)", "R", "W", "1-11"],
          ["1-9", "9-6", "8-4", "9-5", "4-11", "W", "9-1"],
          ["3-11", "9-5", "9-6", "9-6", "N (10-8)", "R", "W"],
          ["8-4", "8-4", "8-4", "8-4", "8-4", "9-1", "W"],
          ["1-11", "1-9", "W", "8-5", "9-4", "N (10-8)", "R"],
          ["W", "1-11", "5-10", "9-1", "8-4", "9-4", "N (10-8)"],
          ["R", "W", "1-11", "1-9", "9-6", "8-5", "8-4"],
          ["W", "1-11", "1-9", "9-4", "9-1", "8-5", "8-4"]
        ]
      },
      group3: {
        name: "3組 (14行)",
        totalRows: 14,
        data: [
          ["N (10-8)", "R", "W", "9-5", "9-5", "1-11", "2-10"],
          ["W", "9-6", "8-5", "9-5", "1-10", "1-10", "W"],
          ["9-6", "2-10", "1-11", "N (10-8)", "R", "W", "9-4"],
          ["9-4", "9-5", "8-4", "9-1", "8-5", "9-5", "W"],
          ["1-10", "N (10-8)", "R", "W", "8-4", "8-5", "9-5"],
          ["9-5", "3-11", "3-11", "W", "8-4", "9-5", "9-1"],
          ["4-11", "1-11", "N (10-8)", "R", "W", "9-6", "9-5"],
          ["9-6", "8-1", "9-4", "3-11", "1-11", "W", "8-1"],
          ["8-4", "9-6", "10-5", "1-11", "N (10-8)", "R", "W"],
          ["2-11", "3-10", "9-1", "9-6", "8-4", "9-4", "W"],
          ["9-5", "9-4", "9-6", "W", "1-11", "N (10-8)", "R"],
          ["W", "8-4", "9-4", "9-5", "9-4", "8-4", "4-10"],
          ["1-10", "W", "9-4", "9-4", "10-5", "9-1", "N (10-8)"],
          ["R", "W", "8-4", "8-4", "9-6", "1-10", "1-11"]
        ]
      },
      group4: {
        name: "4組 (5行)",
        totalRows: 5,
        data: [
          ["8-1", "9-4", "9-5", "8-4", "W", "4-11", "1-10"],
          ["9-5", "9-5", "9-5", "2-10", "9-1", "W", "8-4"],
          ["9-4", "8-1", "W", "8-4", "9-5", "1-11", "5-11"],
          ["10-5", "9-1", "1-11", "5-11", "W", "9-6", "9-5"],
                    ["8-4", "10-5", "9-6", "1-11", "4-10", "9-1", "W"]
        ]
      },
      groupCell: {
        name: "Cell組 (6行)",
        totalRows: 6,
        data: [
          ["9-5", "9-5", "9-5", "8-5", "9-1", "W", "9-4"],
          ["9-1", "9-5", "9-5", "9-6", "9-4", "8-4", "W"],
          ["8-4", "8-4", "8-4", "9-1", "W", "8-4", "9-5"],
          ["9-6", "W", "9-6", "4-11", "4-11", "9-5", "9-1"],
          ["9-5", "9-5", "W", "9-5", "9-5", "9-5", "9-1"],
          ["1-11", "5-11", "5-11", "W", "9-6", "9-6", "9-1"]
        ]
      }
    };

    const dayNames = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    const ANCHOR_DATE = new Date(2026, 0, 5);

    function getAbsoluteWeekIndex(dateObj) {
      const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      const day = d.getDay();
      const diffToMon = day === 0 ? -6 : 1 - day;
      const monday = new Date(d);
      monday.setDate(d.getDate() + diffToMon);
      return Math.round((monday.getTime() - ANCHOR_DATE.getTime()) / (7 * 24 * 60 * 60 * 1000));
    }

    const todayObj = new Date();
    const todayAbsWeek = getAbsoluteWeekIndex(todayObj);

    // 10 位成員設定 (支援已知放假區間)
    const members = [
      { name: "同事 A", group: "group2", row: 1, baseDate: "", hasVacation: false, vacStart: "", vacEnd: "", active: true, expanded: true },
      { name: "同事 B", group: "group3", row: 14, baseDate: "", hasVacation: false, vacStart: "", vacEnd: "", active: true, expanded: true },
      { name: "同事 C", group: "group4", row: 1, baseDate: "", hasVacation: false, vacStart: "", vacEnd: "", active: true, expanded: true },
      { name: "同事 D", group: "group2", row: 1, baseDate: "", hasVacation: false, vacStart: "", vacEnd: "", active: false, expanded: false },
      { name: "同事 E", group: "group3", row: 1, baseDate: "", hasVacation: false, vacStart: "", vacEnd: "", active: false, expanded: false },
      { name: "同事 F", group: "group4", row: 1, baseDate: "", hasVacation: false, vacStart: "", vacEnd: "", active: false, expanded: false },
      { name: "同事 G", group: "group2", row: 1, baseDate: "", hasVacation: false, vacStart: "", vacEnd: "", active: false, expanded: false },
      { name: "同事 H", group: "group3", row: 1, baseDate: "", hasVacation: false, vacStart: "", vacEnd: "", active: false, expanded: false },
      { name: "同事 I", group: "group4", row: 1, baseDate: "", hasVacation: false, vacStart: "", vacEnd: "", active: false, expanded: false },
      { name: "同事 J", group: "group2", row: 1, baseDate: "", hasVacation: false, vacStart: "", vacEnd: "", active: false, expanded: false }
    ];

    let calYear = todayObj.getFullYear();
    let calMonth = todayObj.getMonth() + 1;

    function renderMembersUI() {
      const box = document.getElementById("membersContainer");
      box.innerHTML = "";

      members.forEach((m, idx) => {
        let rowOptions = "";
        const maxR = ROSTERS[m.group].totalRows;
        for (let r = 1; r <= maxR; r++) {
          rowOptions += `<option value="${r}" ${r === m.row ? 'selected' : ''}>第 ${r} 行</option>`;
        }

        const isAlwaysOpen = (idx < 3);

        let cardHtml = `
          <div class="member-box" id="memberCard_${idx}" style="${(!isAlwaysOpen && !m.expanded) ? 'display:none;' : ''}">
            <div class="member-box-header">
              <input type="text" class="member-name-input" value="${m.name}" onchange="updateMember(${idx}, 'name', this.value)">
              <label style="font-size:0.8rem; cursor:pointer;">
                <input type="checkbox" ${m.active ? 'checked' : ''} onchange="updateMember(${idx}, 'active', this.checked)"> 參與聚會
              </label>
            </div>
            <div class="field-row">
                            <span>組別：</span>
              <select onchange="updateMemberGroup(${idx}, this.value)">
                <option value="group2" ${m.group==='group2'?'selected':''}>2組 (12行)</option>
                <option value="group3" ${m.group==='group3'?'selected':''}>3組 (14行)</option>
                <option value="group4" ${m.group==='group4'?'selected':''}>4組 (5行)</option>
                <option value="groupCell" ${m.group==='groupCell'?'selected':''}>Cell組 (6行)</option>
              </select>
              <span>基準日處於：</span>
              <select onchange="updateMember(${idx}, 'row', parseInt(this.value))">
                ${rowOptions}
              </select>
            </div>
            <div class="custom-date-box">
              <span>📅 基準日期 (留空預設今日)：</span>
              <input type="date" value="${m.baseDate}" onchange="updateMember(${idx}, 'baseDate', this.value)">
            </div>
            <!-- 已知放假區間 (小月曆) -->
            <div class="known-vacation-box">
              <label style="cursor:pointer; font-weight:bold; color:#22543d;">
                <input type="checkbox" ${m.hasVacation ? 'checked' : ''} onchange="updateMember(${idx}, 'hasVacation', this.checked)"> 已知放假區間：
              </label>
              <div style="${!m.hasVacation ? 'display:none;' : 'display:flex; align-items:center; gap:4px;'}">
                <input type="date" value="${m.vacStart}" onchange="updateMember(${idx}, 'vacStart', this.value)">
                <span>至</span>
                <input type="date" value="${m.vacEnd}" onchange="updateMember(${idx}, 'vacEnd', this.value)">
              </div>
            </div>
          </div>
        `;

        if (!isAlwaysOpen) {
          box.innerHTML += `
            <div>
              <button class="member-collapse-btn" onclick="toggleSingleMember(${idx})">
                <span>👤 ${m.name} (${m.active ? '已勾選參與' : '未參與'})</span>
                <span>${m.expanded ? '▲ 收起' : '▼ 展開編輯'}</span>
              </button>
              ${cardHtml}
            </div>
          `;
        } else {
          box.innerHTML += cardHtml;
        }
      });
    }

    window.toggleSingleMember = (idx) => {
      members[idx].expanded = !members[idx].expanded;
      renderMembersUI();
    };

    window.updateMember = (idx, key, val) => {
      members[idx][key] = val;
      if (key === 'hasVacation') renderMembersUI();
      renderAll();
    };

    window.updateMemberGroup = (idx, val) => {
      members[idx].group = val;
      members[idx].row = 1;
      renderMembersUI();
      renderAll();
    };

    // 計算成員在特定日期的班次 (納入已知放假區間)
    function getMemberShiftOnDate(m, targetDate) {
      // 1. 先檢查是否落在已知放假區間內
      if (m.hasVacation && m.vacStart && m.vacEnd) {
        const tStr = `${targetDate.getFullYear()}-${String(targetDate.getMonth()+1).padStart(2,'0')}-${String(targetDate.getDate()).padStart(2,'0')}`;
        if (tStr >= m.vacStart && tStr <= m.vacEnd) {
          return "W"; // 區間內強制標記為放假 W
        }
      }

      // 2. 正常輪更推算
      const roster = ROSTERS[m.group];
      let baseAbs = todayAbsWeek;

      if (m.baseDate) {
        const parts = m.baseDate.split('-');
        const bd = new Date(parts[0], parts[1] - 1, parts[2]);
        baseAbs = getAbsoluteWeekIndex(bd);
      }

      const targetAbs = getAbsoluteWeekIndex(targetDate);
      const diffWeeks = targetAbs - baseAbs;

      let r = ((m.row - 1 + diffWeeks) % roster.totalRows) + 1;
      if (r <= 0) r += roster.totalRows;

      const d = targetDate.getDay();
      const dayIdx = d === 0 ? 6 : d - 1;
      return roster.data[r - 1][dayIdx];
    }

    // 依點心紙分類判定班次
    function checkShiftCategory(s) {
      if (s === 'W' || s === 'AL') return 'w';
      if (s === 'R') return 'r';
      if (s === '9-1' || s === '8-1') return 'half';
      if (s.startsWith('N')) return 'n';
      // 早班收 4-6 點
      if (['8-4','8-5','9-4','9-5','9-6','10-5'].includes(s)) return 'early';
      // P更 / 中更
      if (['1-9','1-10','1-11','2-10','2-11','3-10','3-11','4-10','4-11','5-10','5-11'].includes(s)) return 'p';
      return 'other';
    }

    function isShiftAllowedByDimSum(shift) {
      const cat = checkShiftCategory(shift);
      if (cat === 'w' && document.getElementById('shift_w').checked) return true;
      if (cat === 'r' && document.getElementById('shift_r').checked) return true;
      if (cat === 'half' && document.getElementById('shift_half').checked) return true;
      if (cat === 'early' && document.getElementById('shift_early').checked) return true;
      if (cat === 'p' && document.getElementById('shift_p').checked) return true;
      if (cat === 'n' && document.getElementById('shift_n').checked) return true;
      return false;
    }

    function renderCompareList() {
      const listContainer = document.getElementById("matchList");
      const daysCount = parseInt(document.getElementById("rangeDays").value);
      const activeList = members.filter(m => m.active);
      const total = activeList.length;

      // 門檻計算
      const mode = document.querySelector('input[name="thresholdMode"]:checked').value;
      let threshold = 1;
      if (mode === 'half') {
        threshold = total > 0 ? Math.ceil(total / 2) : 999;
      } else {
        threshold = parseInt(document.getElementById('customThresholdNum').value) || 1;
      }

      document.getElementById("thresholdNotice").innerText = `(已選 ${total} 人，需至少 ${threshold} 人符合)`;

      if (total < 2) {
        listContainer.innerHTML = `<div style="color:#718096; padding:10px;">請至少勾選 2 位參與同事進行比對。</div>`;
        return;
      }

      let matchesHtml = "";
      let foundCount = 0;

      for (let i = 0; i < daysCount; i++) {
        const checkDate = new Date(todayObj);
        checkDate.setDate(todayObj.getDate() + i);

        const mShifts = activeList.map(m => ({
          name: m.name,
          shift: getMemberShiftOnDate(m, checkDate)
        }));

        // 符合點心紙勾選的名單
        const qualified = mShifts.filter(item => isShiftAllowedByDimSum(item.shift));

        if (qualified.length >= threshold) {
          foundCount++;
          const monthStr = checkDate.getMonth() + 1;
          const dateStr = checkDate.getDate();
          const dayStr = dayNames[checkDate.getDay()];
          const isTodayTag = (i === 0) ? " (今日)" : "";
          const badgeText = (qualified.length === total) ? "全員符合" : `${qualified.length}/${total}人符合`;

          const shiftsDetail = mShifts.map(x => {
            const isOk = isShiftAllowedByDimSum(x.shift);
            return `<b style="${isOk ? 'color:#27ae60;' : 'color:#a0aec0;'}">${x.name}</b>: ${x.shift}`;
          }).join(' ｜ ');

          matchesHtml += `
            <div class="match-card">
              <div class="match-card-header">
                <span class="match-date">${monthStr}月${dateStr}日 (${dayStr})${isTodayTag}</span>
                <span class="match-badge">${badgeText}</span>
              </div>
              <div class="match-summary-text">✨ 符合條件：${qualified.map(x=>x.name).join('、')} (${qualified.length}人)</div>
              <div class="match-shifts-row">${shiftsDetail}</div>
            </div>
          `;
        }
      }

      if (foundCount === 0) {
        matchesHtml = `<div style="color:#718096; padding:10px;">在未來 ${daysCount} 天內未找到符合門檻要求之日子，請嘗試放寬點心紙條件。</div>`;
      }

      listContainer.innerHTML = matchesHtml;
    }

    function renderCalendar() {
      document.getElementById("calTitle").innerText = `${calYear} 年 ${calMonth} 月`;
      const firstDate = new Date(calYear, calMonth - 1, 1);
      const lastDate = new Date(calYear, calMonth, 0);
      const firstAbs = getAbsoluteWeekIndex(firstDate);
      const lastAbs = getAbsoluteWeekIndex(lastDate);

      const activeList = members.filter(m => m.active);
      const total = activeList.length;

      const mode = document.querySelector('input[name="thresholdMode"]:checked').value;
      const threshold = (mode === 'half') ? Math.ceil(total / 2) : (parseInt(document.getElementById('customThresholdNum').value) || 1);

      let html = "";
      for (let w = firstAbs; w <= lastAbs; w++) {
        const mon = new Date(ANCHOR_DATE);
        mon.setDate(ANCHOR_DATE.getDate() + w * 7);

        html += "<tr>";
        for (let d = 0; d < 7; d++) {
          const cur = new Date(mon);
          cur.setDate(mon.getDate() + d);

          if (cur.getMonth() + 1 === calMonth) {
            let qualifiedCount = 0;
            activeList.forEach(m => {
              const s = getMemberShiftOnDate(m, cur);
              if (isShiftAllowedByDimSum(s)) qualifiedCount++;
            });

            const isMatched = (total >= 2 && qualifiedCount >= threshold);
            const dateISO = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;

            html += `
              <td class="${isMatched ? 'cal-match-bg' : ''}" onclick="openCalDetail('${dateISO}')">
                <div style="font-weight:bold; color:#718096;">${cur.getDate()}</div>
                ${isMatched ? `<div style="color:#27ae60; font-weight:bold; font-size:0.65rem;">🎉${qualifiedCount}/${total}人</div>` : ''}
              </td>
            `;
          } else {
            html += `<td style="background:#fafafa;"></td>`;
          }
        }
        html += "</tr>";
      }
      document.getElementById("calTableBody").innerHTML = html;
    }

    window.openCalDetail = (dateISO) => {
      const parts = dateISO.split('-');
      const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
      const dayStr = dayNames[targetDate.getDay()];

      const activeList = members.filter(m => m.active);
      let passedNames = [];
      let fullListHtml = "";

      activeList.forEach(m => {
        const s = getMemberShiftOnDate(m, targetDate);
        const isOk = isShiftAllowedByDimSum(s);
        if (isOk) passedNames.push(m.name);

        fullListHtml += `<div><b>${m.name}</b> (${ROSTERS[m.group].name})：<span style="font-weight:bold; ${isOk ? 'color:#27ae60;' : 'color:#e53e3e;'}">${s}</span> ${isOk ? '✅' : '❌'}</div>`;
      });

      document.getElementById("modalCalDate").innerText = `📅 ${parts[0]}年${parts[1]}月${parts[2]}日 (${dayStr})`;
      
      let summaryText = passedNames.length > 0 
        ? `<span style="color:#27ae60;">🎉 符合點心紙條件：${passedNames.join('、')} (${passedNames.length}人)</span>`
        : `<span style="color:#888;">當天無人符合所選點心紙條件</span>`;

      document.getElementById("modalCalSummary").innerHTML = summaryText;
      document.getElementById("modalCalList").innerHTML = fullListHtml;
      document.getElementById("calDetailModal").style.display = "flex";
    };

    window.closeCalModal = () => {
      document.getElementById("calDetailModal").style.display = "none";
    };

    window.navMonth = (delta) => {
      calMonth += delta;
      if (calMonth > 12) { calMonth = 1; calYear++; }
      if (calMonth < 1) { calMonth = 12; calYear--; }
      renderCalendar();
    };

    function renderAll() {
      renderCompareList();
      renderCalendar();
    }

    renderMembersUI();
    renderAll();
  </script>
</body>
</html>
