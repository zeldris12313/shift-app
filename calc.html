<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更期大假銜接與推算工具 (需登入)</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #e67e22;
      --highlight: #27ae60;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #fdfbf7;
      color: #333;
    }
    .auth-container {
      max-width: 380px;
      margin: 50px auto;
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-top: 5px solid var(--accent-color);
      text-align: center;
    }
    .auth-container h2 { margin-top: 0; color: var(--primary-color); }
    .auth-container input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .btn-auth {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
      width: 96%;
      margin-top: 10px;
    }
    .btn-google {
      background: #4285f4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
      width: 96%;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .auth-toggle {
      font-size: 0.85rem;
      color: #7f8c8d;
      margin-top: 15px;
      cursor: pointer;
      text-decoration: underline;
    }

    /* 主應用區域 */
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-top: 6px solid var(--accent-color);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn-logout {
      background: #95a5a6;
      color: white;
      border: none;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
    }
    label { font-weight: bold; font-size: 0.9rem; }
    select, input[type="number"], input[type="date"] {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
    }

    .result-box {
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      line-height: 1.6;
    }
    .result-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #d35400;
      margin-bottom: 8px;
    }
    .highlight-text {
      color: var(--highlight);
      font-size: 1.25rem;
      font-weight: bold;
      text-decoration: underline;
    }

    /* 一覽對照表 */
    .table-title {
      font-weight: bold;
      margin: 15px 0 8px;
      color: #555;
    }
    .connect-preview {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0;
    }
    .connect-item {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 8px 10px;
      text-align: center;
      min-width: 90px;
      flex-shrink: 0;
    }
    .connect-item.active {
      background: #ffe0b2;
      border-color: #e67e22;
      font-weight: bold;
    }

    /* 雲端保存紀錄清單 */
    .records-box {
      background: #f1f2f6;
      border-radius: 8px;
      padding: 12px;
      margin-top: 20px;
    }
    .record-item {
      background: white;
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-save-record {
      background: var(--highlight);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: bold;
    }

    /* 班表預覽 */
    .table-container { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.85rem; }
    th, td { padding: 6px 4px; border: 1px solid #e0e0e0; }
    th { background: #f1f2f6; }
    .cell-off { background: #ffeaa7; color: #d63031; }
  </style>

  <!-- Firebase App & Auth & Firestore SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signInWithPopup, 
      GoogleAuthProvider, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBR6sSm99LLA7k7x6bzqMRsKHP7lBLNnnM",
      authDomain: "three-mum.firebaseapp.com",
      projectId: "three-mum",
      storageBucket: "three-mum.firebasestorage.app",
      messagingSenderId: "759414785710",
      appId: "1:759414785710:web:6ae6f93040be6325898f3f",
      measurementId: "G-QFKQMNB71B"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let savedRecords = [];

    // 監聽登入狀態
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("authPanel").style.display = "none";
        document.getElementById("appPanel").style.display = "block";
        document.getElementById("userLabel").innerText = user.email || "已登入用戶";
        loadUserRecords();
        window.calculate();
      } else {
        currentUser = null;
        document.getElementById("authPanel").style.display = "block";
        document.getElementById("appPanel").style.display = "none";
      }
    });

    // Email 登入/註冊邏輯
    let isRegisterMode = false;
    window.toggleAuthMode = () => {
      isRegisterMode = !isRegisterMode;
      document.getElementById("authTitle").innerText = isRegisterMode ? "📝 註冊帳號" : "🔒 登入推算系統";
      document.getElementById("submitAuthBtn").innerText = isRegisterMode ? "立即註冊" : "登入";
      document.getElementById("toggleBtn").innerText = isRegisterMode ? "已有帳號？點此登入" : "未有帳號？點此免費註冊";
      document.getElementById("authMsg").innerText = "";
    };

    window.submitEmailAuth = async () => {
      const email = document.getElementById("authEmail").value.trim();
      const pass = document.getElementById("authPassword").value;
      const msgBox = document.getElementById("authMsg");
      msgBox.innerText = "";

      if (!email || !pass) {
        msgBox.innerText = "請輸入完整 Email 及密碼";
        return;
      }

      try {
        if (isRegisterMode) {
          await createUserWithEmailAndPassword(auth, email, pass);
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
      } catch (e) {
        msgBox.innerText = "錯誤: " + e.message;
      }
    };

    // Google 一鍵登入
    window.loginWithGoogle = async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (e) {
        document.getElementById("authMsg").innerText = "Google 登入失敗: " + e.message;
      }
    };

    window.userLogout = () => {
      signOut(auth);
    };

    // 載入該用家在 Firestore 的私人推算紀錄
    async function loadUserRecords() {
      if (!currentUser) return;
      try {
        const snap = await getDoc(doc(db, "user_records", currentUser.uid));
        if (snap.exists() && snap.data().records) {
          savedRecords = snap.data().records;
        } else {
          savedRecords = [];
        }
        renderRecords();
      } catch (e) {
        console.error(e);
      }
    }

    // 儲存當前推算結果
    window.saveCurrentCalc = async () => {
      if (!currentUser) return;
      const desc = document.getElementById("resultContent").innerText;
      const title = document.getElementById("recordTitleInput").value.trim() || "未命名推算";
      
      const newRec = {
        title,
        desc,
        date: new Date().toLocaleDateString()
      };

      savedRecords.unshift(newRec);
      if (savedRecords.length > 5) savedRecords.pop(); // 保持最多 5 條記錄

      try {
        await setDoc(doc(db, "user_records", currentUser.uid), { records: savedRecords });
        document.getElementById("recordTitleInput").value = "";
        renderRecords();
        alert("已成功保存記錄！");
      } catch (e) {
        alert("儲存失敗: " + e.message);
      }
    };

    function renderRecords() {
      const box = document.getElementById("recordsList");
      box.innerHTML = "";
      if (savedRecords.length === 0) {
        box.innerHTML = `<div style="color:#7f8c8d; font-size:0.85rem;">暫無儲存紀錄。</div>`;
        return;
      }
      savedRecords.forEach((rec, idx) => {
        box.innerHTML += `
          <div class="record-item">
            <div>
              <b>${rec.title}</b> (${rec.date})<br>
              <span style="color:#555;">${rec.desc}</span>
            </div>
          </div>
        `;
      });
    }

    // ----------------- 班表演算法 -----------------
    const ROSTERS = {
      group2: {
        name: "2組 (12行)",
        totalRows: 12,
        data: [
          ["N (10-8)", "R", "W", "1-11", "1-9", "9-6", "9-4"],
          ["9-5", "N (10-8)", "R", "W", "1-11", "1-9", "9-5"],
          ["9-5", "9-5", "1-9", "9-5", "9-5", "9-1", "W"],
          ["8-4", "9-5", "N (10-8)", "R", "W", "1-11", "1-9"],
          ["9-6", "8-4", "9-4", "N (10-8)", "R", "W", "1-11"],
          ["1-9", "9-6", "8-4", "9-5", "4-11", "W", "9-1"],
          ["3-11", "9-5", "9-6", "9-6", "N (10-8)", "R", "W"],
          ["8-4", "8-4", "8-4", "8-4", "8-4", "9-1", "W"],
          ["1-11", "1-9", "W", "8-5", "9-4", "N (10-8)", "R"],
          ["W", "1-11", "5-10", "9-1", "8-4", "9-4", "N (10-8)"],
          ["R", "W", "1-11", "1-9", "9-6", "8-5", "8-4"],
          ["W", "1-11", "1-9", "9-4", "9-1", "8-5", "8-4"]
        ]
      },
      group3: {
        name: "3組 (14行)",
        totalRows: 14,
        data: [
          ["N (10-8)", "R", "W", "9-5", "9-5", "1-11", "2-10"],
          ["W", "9-6", "8-5", "9-5", "1-10", "1-10", "W"],
          ["9-6", "2-10", "1-11", "N (10-8)", "R", "W", "9-4"],
          ["9-4", "9-5", "8-4", "9-1", "8-5", "9-5", "W"],
          ["1-10", "N (10-8)", "R", "W", "8-4", "8-5", "9-5"],
          ["9-5", "3-11", "3-11", "W", "8-4", "9-5", "9-1"],
          ["4-11", "1-11", "N (10-8)", "R", "W", "9-6", "9-5"],
          ["9-6", "8-1", "9-4", "3-11", "1-11", "W", "8-1"],
          ["8-4", "9-6", "10-5", "1-11", "N (10-8)", "R", "W"],
          ["2-11", "3-10", "9-1", "9-6", "8-4", "9-4", "W"],
          ["9-5", "9-4", "9-6", "W", "1-11", "N (10-8)", "R"],
          ["W", "8-4", "9-4", "9-5", "9-4", "8-4", "4-10"],
          ["1-10", "W", "9-4", "9-4", "10-5", "9-1", "N (10-8)"],
          ["R", "W", "8-4", "8-4", "9-6", "1-10", "1-11"]
        ]
      },
      group4: {
        name: "4組 (5行)",
        totalRows: 5,
        data: [
          ["8-1", "9-4", "9-5", "8-4", "W", "4-11", "1-10"],
          ["9-5", "9-5", "9-5", "2-10", "9-1", "W", "8-4"],
          ["9-4", "8-1", "W", "8-4", "9-5", "1-11", "5-11"],
          ["10-5", "9-1", "1-11", "5-11", "W", "9-6", "9-5"],
          ["8-4", "10-5", "9-6", "1-11", "4-10", "9-1", "W"]
        ]
      }
    };

    window.populateRowSelect = () => {
      const groupKey = document.getElementById('groupSelect').value;
      const roster = ROSTERS[groupKey];
      const select = document.getElementById('baseRowSelect');
      const prevVal = parseInt(select.value) || 1;
      select.innerHTML = '';
      for (let i = 1; i <= roster.totalRows; i++) {
        select.innerHTML += `<option value="${i}" ${i === prevVal ? 'selected' : ''}>第 ${i} 行</option>`;
      }
    };

    window.calcByDaysInput = () => {
      const days = parseInt(document.getElementById('daysInput').value);
      if (!isNaN(days)) {
        document.getElementById('weeksInput').value = (days / 7).toFixed(1);
      }
      window.calculate();
    };

    window.calculate = () => {
      populateRowSelectIfNeeded();
      const groupKey = document.getElementById('groupSelect').value;
      const roster = ROSTERS[groupKey];
      const baseRow = parseInt(document.getElementById('baseRowSelect').value);
      const weeks = parseFloat(document.getElementById('weeksInput').value) || 0;

      const weekOffset = Math.floor(weeks);
      let targetRow = ((baseRow - 1 + weekOffset) % roster.totalRows) + 1;
      if (targetRow <= 0) targetRow += roster.totalRows;

      const myNextRow = (targetRow % roster.totalRows) + 1;

      const content = document.getElementById('resultContent');
      if (weeks > 0) {
        content.innerHTML = `
          • 同事在 <b>${weeks} 週後</b>（大假前/最後一週）會行緊：<b style="color:#d63031; font-size:1.1rem;">第 ${targetRow} 行</b><br>
          👉 你放完大假回來要無縫銜接接替佢，必須選擇 ➡️ <span class="highlight-text">第 ${myNextRow} 行</span>！
        `;
      } else {
        content.innerHTML = `請在上方輸入「相隔幾多週」（例如 6 週）推算未來大假行數。`;
      }

      renderConnectPreview(roster, targetRow);
      renderTable(roster, targetRow);
    };

    function renderConnectPreview(roster, targetRow) {
      const box = document.getElementById('connectPreview');
      box.innerHTML = '';
      for (let r = 1; r <= roster.totalRows; r++) {
        const nextR = (r % roster.totalRows) + 1;
        const isMatch = r === targetRow;
        box.innerHTML += `
          <div class="connect-item ${isMatch ? 'active' : ''}">
            <div style="font-size:0.75rem; color:#777;">同事最後行</div>
            <div><b>第 ${r} 行</b></div>
            <div style="font-size:0.75rem; color:#e67e22; margin:2px 0;">⬇️ 銜接</div>
            <div style="font-size:0.75rem; color:#777;">你應接入</div>
            <div style="color:var(--highlight);"><b>第 ${nextR} 行</b></div>
          </div>
        `;
      }
    }

    function renderTable(roster, targetRow) {
      const table = document.getElementById('rosterTable');
      let html = `<thead><tr><th>行數</th><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th><th>SUN</th></tr></thead><tbody>`;
      roster.data.forEach((row, idx) => {
        const rowNum = idx + 1;
        const isTarget = rowNum === targetRow;
        html += `<tr style="${isTarget ? 'background:#fff8e1; font-weight:bold;' : ''}">`;
        html += `<td><b>第 ${rowNum} 行 ${isTarget ? '🎯' : ''}</b></td>`;
        row.forEach(shift => {
          let cls = '';
          if (shift === 'W' || shift === 'R') cls = 'cell-off';
          html += `<td class="${cls}">${shift}</td>`;
        });
        html += `</tr>`;
      });
      html += `</tbody>`;
      table.innerHTML = html;
    }

    let lastGroup = '';
    function populateRowSelectIfNeeded() {
      const currentGroup = document.getElementById('groupSelect').value;
      if (lastGroup !== currentGroup) {
        window.populateRowSelect();
        lastGroup = currentGroup;
      }
    }

    const today = new Date();
    document.getElementById('baseDateInput').value = today.toISOString().split('T')[0];
  </script>
</head>
<body>

  <!-- 1. 登入/註冊面板 -->
  <div class="auth-container" id="authPanel">
    <h2 id="authTitle">🔒 登入推算系統</h2>
    <input type="email" id="authEmail" placeholder="電子郵件 (Email)">
    <input type="password" id="authPassword" placeholder="密碼 (最少6位)">
    <button class="btn-auth" id="submitAuthBtn" onclick="submitEmailAuth()">登入</button>
    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#ffffff" d="M12.24 10.285V13.4h6.887C18.2 16.14 15.645 18 12.24 18c-3.315 0-6-2.685-6-6s2.685-6 6-6c1.47 0 2.805.54 3.84 1.425l2.385-2.385C16.98 3.555 14.73 2.7 12.24 2.7 7.155 2.7 3 6.855 3 11.94s4.155 9.24 9.24 9.24c5.325 0 8.865-3.75 8.865-9.03 0-.615-.06-1.2-.165-1.755H12.24z"/></svg>
      Google 一鍵登入
    </button>
    <div id="authMsg" style="color:#e74c3c; font-size:0.85rem; margin-top:10px;"></div>
    <div class="auth-toggle" id="toggleBtn" onclick="toggleAuthMode()">未有帳號？點此免費註冊</div>
  </div>

  <!-- 2. 主推算工具面板 (登入後顯示) -->
  <div class="container" id="appPanel" style="display:none;">
    <div class="top-bar">
      <div>👤 目前用戶：<b id="userLabel" style="color:var(--highlight);"></b></div>
      <button class="btn-logout" onclick="userLogout()">登出帳號</button>
    </div>

    <h1 style="margin: 5px 0 20px 0;">更期大假銜接與入位推算工具</h1>

    <div class="form-group">
      <label>組別：</label>
      <select id="groupSelect" onchange="calculate()">
        <option value="group2">2組 (12行)</option>
        <option value="group3">3組 (14行)</option>
        <option value="group4">4組 (5行)</option>
      </select>

      <label>同事基準處於：</label>
      <select id="baseRowSelect" onchange="calculate()"></select>

      <label>基準日期：</label>
      <input type="date" id="baseDateInput" onchange="calculate()">
    </div>

    <div class="form-group">
      <label>同事幾多週後放大假？</label>
      <input type="number" id="weeksInput" placeholder="如 6" style="width: 70px;" oninput="calculate()">
      <span>週後</span>

      <span style="color:#aaa; margin: 0 5px;">或</span>

      <label>相隔日數：</label>
      <input type="number" id="daysInput" placeholder="如 42" style="width: 70px;" oninput="calcByDaysInput()">
      <span>天</span>
    </div>

    <div class="result-box">
      <div class="result-title">💡 銜接分析結果：</div>
      <div id="resultContent">請輸入相隔週數或日數進行推算...</div>
      
      <!-- 保存記錄功能 -->
      <div style="margin-top: 12px; display:flex; gap:8px; align-items:center;">
        <input type="text" id="recordTitleInput" placeholder="備註名稱 (例如: 幫呀明頂位)" style="flex:1; padding:6px;">
        <button class="btn-save-record" onclick="saveCurrentCalc()">💾 儲存此推算到個人紀錄</button>
      </div>
    </div>

    <!-- 個人儲存記錄區塊 -->
    <div class="records-box">
      <div style="font-weight:bold; color:var(--primary-color); margin-bottom:8px;">📁 我的雲端推算歷史備忘：</div>
      <div id="recordsList">載入中...</div>
    </div>

    <div class="table-title">📌 該組別全行數【無縫銜接一覽對照表】：</div>
    <div class="connect-preview" id="connectPreview"></div>

    <div class="table-container">
      <div class="table-title">📋 基準組別班表參考：</div>
      <table id="rosterTable"></table>
    </div>
  </div>

</body>
</html>
