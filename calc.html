<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更期大假銜接與推算工具 (分頁月曆版)</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #e67e22;
      --highlight: #27ae60;
      --off-bg: #ffeaa7;
      --night-bg: #dfe6e9;
      --today-highlight: #fdcb6e;
      --target-row-bg: #d4edda;
      --target-row-border: #28a745;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #fdfbf7;
      color: #333;
    }
    .auth-container {
      max-width: 380px;
      margin: 40px auto;
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-top: 5px solid var(--accent-color);
      text-align: center;
    }
    .auth-container input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .btn-auth {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
      width: 96%;
      margin-top: 10px;
    }
    .btn-google {
      background: #4285f4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
      width: 96%;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .auth-toggle {
      font-size: 0.85rem;
      color: #7f8c8d;
      margin-top: 15px;
      cursor: pointer;
      text-decoration: underline;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-top: 6px solid var(--accent-color);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn-logout {
      background: #95a5a6;
      color: white;
      border: none;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 我目前的定位卡片 */
    .my-status-card {
      background: #f0f7fc;
      border: 1.5px solid #2980b9;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 15px;
    }
