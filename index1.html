  <title>主頁大月曆 - 個人一體化更期系統</title>
  <style>
    :root {
      --gc-blue: #1a73e8;
      --gc-bg: #ffffff;
      --gc-border: #dadce0;
      --gc-text: #3c4043;
      --gc-light-text: #70757a;
      --gc-hover: #f1f3f4;
      --pill-holiday: #009688; 
      --pill-note: #039be5;    
      --pill-shift: #4285f4;
      --pill-off: #f1f3f4;
      --pill-night: #5c6bc0;
      --pill-leave: #e53935;
      --pill-ph: #ab47bc;
    }
    * { box-sizing: border-box; font-family: "Google Sans", Roboto, Arial, sans-serif; }
    body { margin: 0; padding: 0; background-color: var(--gc-bg); color: var(--gc-text); overflow-x: hidden; }
    
    /* 頂部導航與工具列 - 極限壓縮版 */
    .top-header { display: flex; flex-direction: column; padding: 6px 12px 8px 12px; border-bottom: 1px solid var(--gc-border); background: white; position: sticky; top: 0; z-index: 100; gap: 8px; }
    .top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    
    /* 醒目日期選擇器 */
    .month-title input[type="date"] { 
      font-size: 1.05rem; font-weight: bold; color: var(--gc-text); background: #f1f3f4; 
      border: 1px solid var(--gc-border); border-radius: 6px; padding: 4px 8px; cursor: pointer; outline: none; font-family: inherit; transition: background 0.2s;
    }
    .month-title input[type="date"]:hover { background: #e8eaed; }
    
    .top-right { display: flex; align-items: center; gap: 8px; }
    .btn-today { border: 1px solid var(--gc-border); background: white; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: var(--gc-text); cursor: pointer; }
    .btn-today:hover { background: var(--gc-hover); }
    .profile-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--gc-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; border: 2px solid white; outline: 1px solid var(--gc-border); cursor: pointer; }

    /* 水平導航按鈕 */
    .nav-links { display: flex; gap: 6px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; width: 100%; align-items: center; }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; text-decoration: none; border: 1px solid var(--gc-border); background: white; color: #5f6368; white-space: nowrap; flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .nav-links a:hover { background: var(--gc-hover); }

    /* 無限月份快速選擇列 */
    .month-scroller { display: flex; overflow-x: auto; padding: 6px 12px; gap: 6px; border-bottom: 1px solid var(--gc-border); background: white; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    .month-scroller::-webkit-scrollbar { display: none; }
    .month-chip { padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; color: var(--gc-text); cursor: pointer; white-space: nowrap; border: 1px solid var(--gc-border); background: white; font-weight: 500; }
    .month-chip.active { background: #c2e7ff; color: #001d35; border-color: #c2e7ff; }
    .month-chip.year-label { border: none; font-weight: bold; padding: 4px; pointer-events: none; font-size: 0.85rem; }

    /* ★ 極致壓縮版設定橫條 ★ */
    .setup-bars-container { display: flex; flex-direction: column; gap: 4px; margin: 4px 12px 8px 12px; }
    .quick-setup-bar { background: #e8f0fe; border-radius: 6px; padding: 4px 8px; border: 1px solid #d2e3fc; display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; align-items: center; font-size: 0.75rem; -webkit-overflow-scrolling: touch; }
    .quick-setup-bar::-webkit-scrollbar { display: none; }
    .anchor-setup-bar { background: #fbf7fd; border-radius: 6px; padding: 4px 8px; border: 1px solid #e8daf0; display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; align-items: center; font-size: 0.75rem; -webkit-overflow-scrolling: touch; }
    .anchor-setup-bar::-webkit-scrollbar { display: none; }
    .setup-select { padding: 2px 4px; border-radius: 4px; border: 1px solid #bdc1c6; font-size: 0.75rem; font-weight: bold; color: var(--gc-text); outline: none; background: white; white-space: nowrap; flex-shrink: 0; }
    .btn-quick-nav { border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: white; cursor: pointer; white-space: nowrap; flex-shrink: 0; }

    /* Google Calendar 網格 */
    .calendar-wrapper { padding: 0 12px 40px 12px; max-width: 1600px; margin: 0 auto; overflow: hidden; touch-action: pan-y; }
    #unifiedCalendarGrid { width: 100%; will-change: transform; }
    .cal-table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 4px; }
    .cal-table th { font-size: 0.75rem; color: var(--gc-light-text); font-weight: 500; padding-bottom: 6px; border-bottom: 1px solid var(--gc-border); }
    .cal-table td { border: 1px solid var(--gc-border); vertical-align: top; height: 95px; padding: 4px; position: relative; cursor: pointer; transition: background 0.1s; }
    .cal-table td:hover { background: #fbfbfb; }
    .cal-table tr td:first-child { border-left: none; width: 45px; background: #fafafa; border-right: 2px solid var(--gc-border); } 
    .cal-table tr td:last-child { border-right: none; }

    /* 強烈標記今日日期 */
    .cal-table td.cell-today { border: 3px solid var(--gc-blue) !important; background-color: #f8fbff !important; box-shadow: inset 0 0 0 2px rgba(26,115,232,0.05); }
    
    .date-header { display: flex; justify-content: center; margin-bottom: 4px; margin-top: 2px; }
    .date-num { font-size: 0.8rem; color: var(--gc-light-text); width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .date-num.today { background: var(--gc-blue); color: white; font-weight: bold; }

    /* 膠囊 Event Pills */
    .event-pill { font-size: 0.7rem; padding: 2px 4px; margin-bottom: 2px; border-radius: 4px; color: white; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; line-height: 1.2; }
    .pill-holiday { background-color: var(--pill-holiday); }
    .pill-note { background-color: var(--pill-note); }
    .pill-shift { background-color: var(--pill-shift); }
    .pill-night { background-color: var(--pill-night); }
    .pill-off { background-color: var(--pill-off); color: var(--gc-text); font-weight:bold; }
    .pill-leave { background-color: var(--pill-leave); }
    .pill-ph { background-color: var(--pill-ph); }
    .custom-override { border-left: 3px solid #fbbc04; }

    .week-tag { text-align: center; font-size: 0.65rem; color: var(--gc-light-text); line-height: 1.2; margin-top: 4px; }
    .week-btn { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 2px 0; border-radius: 4px; font-size: 0.6rem; cursor: pointer; width: 90%; margin: 6px auto 0 auto; display: block; }

    /* 右下角懸浮按鈕 (FAB) - 只保留 + 用作其他未來功能 */
    .fab { display:none; } /* 隱藏 FAB，因為設定已移至頂部 */

    /* PH 統計區 */
    .ph-year-chips-bar { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0; -webkit-overflow-scrolling: touch; }
    .btn-year-chip { background: #ebdef0; color: #4a235a; border: 1px solid #d2b4de; padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 0.85rem; font-weight: bold; white-space: nowrap; flex-shrink: 0; }
    .btn-year-chip.active { background: #8e44ad; color: white; border-color: #8e44ad; }

    /* 電腦版適配 */
    @media (min-width: 768px) {
      .cal-table td { height: 130px; padding: 6px; }
      .date-num { font-size: 0.9rem; }
      .event-pill { font-size: 0.8rem; padding: 3px 8px; margin-bottom: 3px; }
      .cal-table tr td:first-child { width: 60px; }
      .top-header { flex-direction: row; align-items: center; }
      .nav-links { width: auto; margin-left: 20px; padding-bottom: 0; }
    }

    /* Modal 通用 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .modal-card { background: white; border-radius: 8px; width: 90%; max-width: 360px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 1.1rem; color: var(--gc-text); margin: 0 0 16px 0; display:flex; align-items:center; gap:8px; }
    .modal-section { margin-bottom: 16px; }
    .modal-section label { display: block; font-size: 0.8rem; font-weight: bold; color: var(--gc-light-text); margin-bottom: 6px; }
    .select-block { width: 100%; padding: 8px; font-size: 0.95rem; border: 1px solid var(--gc-border); border-radius: 4px; outline: none; }
    .select-block:focus { border-color: var(--gc-blue); }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .btn-modal { padding: 8px 16px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; cursor: pointer; border: none; }
    .btn-save { background: var(--gc-blue); color: white; }
    .btn-cancel { background: transparent; color: var(--gc-light-text); }
    .btn-danger { background: white; color: #d32f2f; border: 1px solid #d32f2f; width:100%; margin-top:10px; }

    /* 登入面板專用 */
    .auth-container { max-width: 380px; margin: 40px auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 5px solid #e67e22; text-align: center; }
    .auth-container input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; outline: none; }
    .auth-container input:focus { border-color: #e67e22; }
    .btn-auth { background: #e67e22; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; width: 100%; margin-top: 8px; }
    .btn-google { background: #4285f4; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .auth-toggle { font-size: 0.85rem; color: #7f8c8d; margin-top: 15px; cursor: pointer; text-decoration: underline; font-weight: bold; }
  </style>

        document.getElementById("forgotBtn").innerText = "忘記密碼？";
        document.getElementById("toggleBtn").style.display = "inline";
      }
      document.getElementById("authMsg").innerText = "";
    };

    window.submitUserAuth = async () => {
      const username = document.getElementById("authUsername").value.trim();
      const pass = document.getElementById("authPassword").value;
      const staffId = document.getElementById("authStaffId").value.trim().toUpperCase();
      const msgBox = document.getElementById("authMsg");
      msgBox.innerText = "";

      if (!username) { msgBox.innerText = authMode === "forgot" ? "請輸入你想設定的【新帳戶名稱】！" : "請輸入帳戶名稱！"; return; }
      const vEmail = toVirtualEmail(username);

      try {
        if (authMode === "register") {
          if (!pass || pass.length < 6) { msgBox.innerText = "請設定最少 6 位密碼！"; return; }
          if (!staffId) { msgBox.innerText = "請填寫員工編號（此編號不能重複且用於驗證）！"; return; }
          const staffRef = doc(db, "registered_staff_ids", staffId);
          if ((await getDoc(staffRef)).exists()) { msgBox.innerText = "❌ 員工編號已被註冊！"; return; }
          const cred = await createUserWithEmailAndPassword(auth, vEmail, pass);
          await setDoc(staffRef, { username, uid: cred.user.uid });
          await setDoc(doc(db, "public_user_map", username.toLowerCase()), { uid: cred.user.uid, staffId });
          await setDoc(doc(db, "user_security", cred.user.uid), { username, staffId });
          alert("🎉 註冊成功！系統即將為你登入。");
        } else if (authMode === "forgot") {
          if (!staffId) { msgBox.innerText = "請輸入登記時綁定的員工編號！"; return; }
          if (!pass || pass.length < 6) { msgBox.innerText = "請輸入最少 6 位新密碼！"; return; }
          const staffRef = doc(db, "registered_staff_ids", staffId);
          const snap = await getDoc(staffRef);
          if (!snap.exists()) { msgBox.innerText = "❌ 查無此員工編號！"; return; }
          const oldUid = snap.data().uid;
          const cred = await createUserWithEmailAndPassword(auth, vEmail, pass);
          const newUid = cred.user.uid;
          const cols = ["user_ph_usage", "user_shift_overrides", "user_day_notes", "user_timeline"];
          for (const c of cols) {
            const d = await getDoc(doc(db, c, oldUid));
            if (d.exists()) await setDoc(doc(db, c, newUid), d.data());
          }
          await setDoc(staffRef, { username, uid: newUid });
          await setDoc(doc(db, "public_user_map", username.toLowerCase()), { uid: newUid, staffId });
          alert("🎉 帳號名稱及密碼重設成功！所有更期已轉移。");
        } else {
          if (!pass) { msgBox.innerText = "請輸入密碼！"; return; }
          await signInWithEmailAndPassword(auth, vEmail, pass);
        }
      } catch (e) { msgBox.innerText = "登入失敗: " + e.message; }
    };
    
    window.loginWithGoogle = async () => {
      try { await signInWithPopup(auth, googleProvider); } 
      catch (e) { document.getElementById("authMsg").innerText = "Google登入失敗: " + e.message; }
    };
    window.userLogout = () => signOut(auth);

    // ------------- Firebase 資料讀寫 -------------
    async function loadUserData() {
      if (!currentUser) return;
      const uid = currentUser.uid;
      const getD = async (col) => (await getDoc(doc(db, col, uid))).data() || {};
      userPhUsage = (await getD("user_ph_usage")).usage || {};
      userShiftOverrides = (await getD("user_shift_overrides")).overrides || {};
      userDayNotes = (await getD("user_day_notes")).notes || {};
      
      const tl = await getD("user_timeline");
      timelineAnchors = tl.anchors || [{ absWeek: todayAbsWeek, group: 'group3', startRow: 14 }];
      vacationWeeks = new Set(tl.vacations || []);
      clearedYears = new Set(tl.clearedYears || []);
    }

    async function saveUserTimeline() {
      if (!currentUser) return;
      await setDoc(doc(db, "user_timeline", currentUser.uid), { anchors: timelineAnchors, vacations: Array.from(vacationWeeks), clearedYears: Array.from(clearedYears) });
    }

    // ------------- 推算核心 -------------
    function getWeekShiftState(absWeek) {
      const wInfo = getWeekInfoFromAbsIndex(absWeek);
      if (vacationWeeks.has(absWeek)) return { isVacation: true, shifts: ["大假","大假","大假","大假","大假","大假","大假"] };
      if (clearedYears.has(wInfo.year)) return { isCleared: true, shifts: ["","","","","","",""] };
      if (!timelineAnchors.some(a => a.manual)) return { isCleared: true, shifts: ["","","","","","",""] };
      
      const baseAnchor = timelineAnchors.find(a => a.manual) || timelineAnchors[0];
      const pastVacs = Array.from(vacationWeeks).filter(v => v < absWeek).sort((a,b)=>b-a);
      if (pastVacs.length > 0 && !timelineAnchors.find(a => a.absWeek > pastVacs[0] && a.absWeek <= absWeek && a.manual)) {
        return { isPending: true, shifts: ["待入位","待入位","待入位","待入位","待入位","待入位","待入位"] };
      }

      const active = timelineAnchors.filter(a => a.absWeek <= absWeek).sort((a,b)=>b.absWeek-a.absWeek)[0] || baseAnchor;
      const rost = ROSTERS[active.group];
      let r = ((active.startRow - 1 + (absWeek - active.absWeek)) % rost.totalRows) + 1;
      if (r <= 0) r += rost.totalRows;
      return { isVacation: false, group: active.group, rowNum: r, shifts: rost.data[r - 1] };
    }

    // ------------- 獨立雙插旗功能 (今日 vs 特定日期) -------------
    window.updateQuickRowSelect = (grp) => {
      const sel = document.getElementById("quickRowSelect");
      if(!sel) return;
      sel.innerHTML = "";
      for (let r = 1; r <= ROSTERS[grp].totalRows; r++) sel.innerHTML += `<option value="${r}">${r}行</option>`;
    };

    window.quickApplyToday = async () => {
      const group = document.getElementById("quickGroupSelect").value;
      const row = parseInt(document.getElementById("quickRowSelect").value);
      
      if (typeof clearedYears !== 'undefined') {
        clearedYears.delete(todayObj.getFullYear());
        clearedYears.delete(viewCalYear);
      }
      
      // 以今日為基準：清除今日及未來所有殘留旗標，保證順利向後推
      timelineAnchors = timelineAnchors.filter(a => a.absWeek < todayAbsWeek);
      timelineAnchors.push({ absWeek: todayAbsWeek, group: group, startRow: row, manual: true });
      timelineAnchors.sort((a,b) => a.absWeek - b.absWeek);

      viewCalYear = todayObj.getFullYear();
      viewCalMonth = todayObj.getMonth() + 1;

      await saveUserTimeline();
      buildMonthScroller();
      renderUnifiedCalendar();
      alert(`✅ 快速導入成功！\n已採用 ${ROSTERS[group].name} 第 ${row} 行，並自動向後順推所有更期。`);
    };

    window.onAnchorGroupChange = (grp) => {
      const sel = document.getElementById("anchorRowSelect");
      sel.innerHTML = "";
      for (let r = 1; r <= ROSTERS[grp].totalRows; r++) sel.innerHTML += `<option value="${r}">${r}行</option>`;
    };

    window.setManualAnchorAtDate = async () => {
      const dateStr = document.getElementById("anchorDateInput").value;
      if (!dateStr) { alert("請先選擇要插旗換組的日期！"); return; }
      
      const parts = dateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const absWeek = getAbsoluteWeekIndex(d);
      const group = document.getElementById("anchorGroupSelect").value;
      const row = parseInt(document.getElementById("anchorRowSelect").value);

      if (typeof clearedYears !== 'undefined') {
        clearedYears.delete(d.getFullYear());
        clearedYears.delete(viewCalYear);
      }

      // 以指定日為基準：清除該日及未來所有殘留旗標，保證順利向後推
      timelineAnchors = timelineAnchors.filter(a => a.absWeek < absWeek);
      timelineAnchors.push({ absWeek, group, startRow: row, manual: true });
      timelineAnchors.sort((a,b) => a.absWeek - b.absWeek);

      viewCalYear = d.getFullYear();
      viewCalMonth = d.getMonth() + 1;

      await saveUserTimeline();
      buildMonthScroller();
      renderUnifiedCalendar();
      alert(`✅ 成功設定指定起點！\n由 ${dateStr} 起採用 ${ROSTERS[group].name} 第 ${row} 行，後續所有舊旗已清除並自動順推。`);
    };

    // ------------- UI 渲染與手勢滑動 -------------
    function buildMonthScroller() {
      const scroller = document.getElementById("monthScroller");
      let html = "";
      for (let i = -12; i <= 12; i++) {
        const d = new Date(viewCalYear, viewCalMonth - 1 + i, 1);
        const y = d.getFullYear(); const m = d.getMonth() + 1;
        if (m === 1 || i === -12) html += `<div class="month-chip year-label">${y}</div>`;
        const active = (y === viewCalYear && m === viewCalMonth) ? 'active' : '';
        html += `<div class="month-chip ${active}" id="chip-${y}-${m}" onclick="navToMonth(${y}, ${m})">${m}月</div>`;
      }
      scroller.innerHTML = html;
      
      setTimeout(() => {
        const activeChip = document.getElementById(`chip-${viewCalYear}-${viewCalMonth}`);
        if(activeChip) activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }, 50);
    }

    window.navToMonth = (y, m) => { viewCalYear = y; viewCalMonth = m; buildMonthScroller(); renderUnifiedCalendar(); };
    window.navUnifiedMonth = (delta) => {
      viewCalMonth += delta;
      if (viewCalMonth > 12) { viewCalMonth = 1; viewCalYear++; }
      if (viewCalMonth < 1) { viewCalMonth = 12; viewCalYear--; }
      buildMonthScroller();
      renderUnifiedCalendar();
    };
    window.jumpToToday = () => { navToMonth(todayObj.getFullYear(), todayObj.getMonth() + 1); };

    window.jumpToSpecificDate = (val) => {
      if (!val) return;
      const [y, m, d] = val.split('-');
      navToMonth(parseInt(y), parseInt(m));
    };

    function setupSwipeGestures() {
      const wrapper = document.querySelector('.calendar-wrapper');
      const grid = document.getElementById('unifiedCalendarGrid');
      
      wrapper.addEventListener('touchstart', e => {
        touchstartX = e.changedTouches[0].screenX;
        grid.style.transition = 'none';
      }, {passive: true});

      wrapper.addEventListener('touchmove', e => {
        const touchX = e.changedTouches[0].screenX;
        const deltaX = touchX - touchstartX;
        if (Math.abs(deltaX) < window.innerWidth) {
          grid.style.transform = `translateX(${deltaX}px)`;
        }
      }, {passive: true});

      wrapper.addEventListener('touchend', e => {
        const touchendX = e.changedTouches[0].screenX;
        const deltaX = touchendX - touchstartX;
        
        if (deltaX < -60) {
          grid.style.transition = 'transform 0.25s ease-out';
          grid.style.transform = `translateX(-100%)`;
          setTimeout(() => {
            viewCalMonth += 1; if (viewCalMonth > 12) { viewCalMonth = 1; viewCalYear++; }
            buildMonthScroller(); renderUnifiedCalendar();
            grid.style.transition = 'none'; grid.style.transform = `translateX(100%)`;
            setTimeout(() => { grid.style.transition = 'transform 0.25s ease-out'; grid.style.transform = `translateX(0)`; }, 20);
          }, 250);
        } else if (deltaX > 60) {
          grid.style.transition = 'transform 0.25s ease-out';
          grid.style.transform = `translateX(100%)`;
          setTimeout(() => {
            viewCalMonth -= 1; if (viewCalMonth < 1) { viewCalMonth = 12; viewCalYear--; }
            buildMonthScroller(); renderUnifiedCalendar();
            grid.style.transition = 'none'; grid.style.transform = `translateX(-100%)`;
            setTimeout(() => { grid.style.transition = 'transform 0.25s ease-out'; grid.style.transform = `translateX(0)`; }, 20);
          }, 250);
        } else {
          grid.style.transition = 'transform 0.25s ease-out'; grid.style.transform = `translateX(0)`;
        }
      }, {passive: true});
    }

    function renderUnifiedCalendar() {
      const datePicker = document.getElementById("headerDatePicker");
      if(datePicker) {
        if(viewCalYear === todayObj.getFullYear() && viewCalMonth === todayObj.getMonth() + 1) {
          datePicker.value = `${todayObj.getFullYear()}-${String(todayObj.getMonth()+1).padStart(2,'0')}-${String(todayObj.getDate()).padStart(2,'0')}`;
        } else {
          datePicker.value = `${viewCalYear}-${String(viewCalMonth).padStart(2,'0')}-01`;
        }
      }

      const firstAbs = getAbsoluteWeekIndex(new Date(viewCalYear, viewCalMonth - 1, 1));
      const lastAbs = getAbsoluteWeekIndex(new Date(viewCalYear, viewCalMonth, 0));

      let html = `<table class="cal-table"><thead><tr><th>週數</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr></thead><tbody>`;

      for (let w = firstAbs; w <= lastAbs; w++) {
        const wInfo = getWeekInfoFromAbsIndex(w);
        const st = getWeekShiftState(w);
        
        let rowTag = st.isCleared ? "未導入" : st.isVacation ? "大假" : st.isPending ? "待入位" : `第${st.rowNum}行`;
        let btnTxt = st.isVacation ? "取消" : "大假";

        html += `<tr><td style="text-align:center;">
          <div class="week-tag">${rowTag}</div>
          <button class="week-btn" onclick="toggleVacationWeek(${w})">${btnTxt}</button>
        </td>`;

        for (let d = 0; d < 7; d++) {
          const cur = new Date(wInfo.monday); cur.setDate(cur.getDate() + d);
          if (cur.getMonth() + 1 === viewCalMonth) {
            const dk = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
            const isToday = cur.toDateString() === todayObj.toDateString();
            const numHtml = `<div class="date-header"><div class="date-num ${isToday ? 'today' : ''}">${cur.getDate()}</div></div>`;
            const cellClass = isToday ? "cell-today" : "";
            
            const defShift = st.shifts ? st.shifts[d] : "";
            const custShift = userShiftOverrides[dk] || "";
            const fShift = custShift || defShift;
            const noteText = userDayNotes[dk] || "";
            const hDay = HK_PUBLIC_HOLIDAYS[dk];
            const phH = userPhUsage[dk] || 0;

            let pills = "";
            if (hDay) pills += `<div class="event-pill pill-holiday">${hDay}</div>`;
            if (fShift) {
              let pCls = "pill-shift";
              if (fShift === 'W' || fShift === 'R') pCls = "pill-off";
              else if (fShift.startsWith('N')) pCls = "pill-night";
              else if (fShift === '大假' || fShift === 'AL') pCls = "pill-leave";
              if (custShift) pCls += " custom-override";
              pills += `<div class="event-pill ${pCls}">${fShift}</div>`;
            }
            if (noteText) pills += `<div class="event-pill pill-note">${noteText}</div>`;
            if (phH > 0) pills += `<div class="event-pill pill-ph">PH: ${phH}h</div>`;

            html += `<td class="${cellClass}" onclick="openCombinedModal('${dk}', '${defShift}')">${numHtml}${pills}</td>`;
          } else {
            html += `<td style="background:#fafafa;"><div class="date-header"><div class="date-num" style="color:#ddd;">${cur.getDate()}</div></div></td>`;
          }
        }
        html += `</tr>`;
      }
      html += `</tbody></table>`;
      document.getElementById("unifiedCalendarGrid").innerHTML = html;
      updatePhStatistics();
    }

    // ------------- 操作與 Modal -------------
    window.toggleVacationWeek = async (absWeek) => {
      if (vacationWeeks.has(absWeek)) {
        vacationWeeks.delete(absWeek);
      } else {
        vacationWeeks.add(absWeek);
        timelineAnchors = timelineAnchors.filter(a => a.absWeek < absWeek);
      }
      await saveUserTimeline(); 
      renderUnifiedCalendar();
    };

    function initOverrideShiftSelect() {
      const s = document.getElementById("modalShiftSelect");
      s.innerHTML = `<option value="">-- 維持預設 --</option>`;
      ALL_SHIFT_OPTIONS.forEach(opt => s.innerHTML += `<option value="${opt}">${opt}</option>`);
    }

    window.openCombinedModal = (dk, def) => {
      activeModalDateKey = dk;
      document.getElementById("modalDateTitle").innerHTML = `📅 ${dk} <span style="font-size:0.8rem; color:#70757a; font-weight:normal;">(原定: ${def||'無'})</span>`;
      document.getElementById("phHourSelect").value = userPhUsage[dk] || 0;
      document.getElementById("modalShiftSelect").value = userShiftOverrides[dk] || "";
      document.getElementById("modalNoteInput").value = userDayNotes[dk] || "";
      document.getElementById("combinedModal").style.display = "flex";
    };
    window.closeCombinedModal = () => document.getElementById("combinedModal").style.display="none";

    window.saveCombinedData = async () => {
      const dk = activeModalDateKey;
      const p = parseInt(document.getElementById("phHourSelect").value);
      const s = document.getElementById("modalShiftSelect").value;
      const n = document.getElementById("modalNoteInput").value.trim();
      
      if(p>0) userPhUsage[dk]=p; else delete userPhUsage[dk];
      if(s) userShiftOverrides[dk]=s; else delete userShiftOverrides[dk];
      if(n) userDayNotes[dk]=n; else delete userDayNotes[dk];
      
      await setDoc(doc(db,"user_ph_usage",currentUser.uid),{usage:userPhUsage});
      await setDoc(doc(db,"user_shift_overrides",currentUser.uid),{overrides:userShiftOverrides});
      await setDoc(doc(db,"user_day_notes",currentUser.uid),{notes:userDayNotes});
      closeCombinedModal(); renderPhYearChips(); renderUnifiedCalendar();
    };

    window.resetCombinedDate = async () => {
      const dk = activeModalDateKey;
      delete userPhUsage[dk]; delete userShiftOverrides[dk]; delete userDayNotes[dk];
      await setDoc(doc(db,"user_ph_usage",currentUser.uid),{usage:userPhUsage});
      await setDoc(doc(db,"user_shift_overrides",currentUser.uid),{overrides:userShiftOverrides});
      await setDoc(doc(db,"user_day_notes",currentUser.uid),{notes:userDayNotes});
      closeCombinedModal(); renderPhYearChips(); renderUnifiedCalendar();
    };

    // ------------- PH 統計與重置 -------------
    window.resetYearShiftsAndPh = async () => {
      if (!confirm(`⚠️ 確定重置清空 ${viewCalYear} 年所有更期？\n重置後，月曆將變回未導入的空白狀態。`)) return;
      const clrPh = confirm(`❓ 是否連同 ${viewCalYear} 年 PH 扣減紀錄一併清空？`);
      clearedYears.add(viewCalYear);
      for (const k of Object.keys(userShiftOverrides)) if(k.startsWith(`${viewCalYear}-`)) delete userShiftOverrides[k];
      for (const w of Array.from(vacationWeeks)) if(getWeekInfoFromAbsIndex(w).year === viewCalYear) vacationWeeks.delete(w);
      timelineAnchors = timelineAnchors.filter(a => getWeekInfoFromAbsIndex(a.absWeek).year !== viewCalYear);
      if (clrPh) for (const k of Object.keys(userPhUsage)) if(k.startsWith(`${viewCalYear}-`)) delete userPhUsage[k];
      
      await saveUserTimeline();
      await setDoc(doc(db,"user_shift_overrides",currentUser.uid),{overrides:userShiftOverrides});
      if(clrPh) await setDoc(doc(db,"user_ph_usage",currentUser.uid),{usage:userPhUsage});
      renderPhYearChips();
      renderUnifiedCalendar();
      alert("🎉 該年更期已徹底重置清空！");
    };

    function renderPhYearChips() {
      const setY = new Set([todayObj.getFullYear()]);
      for (const k of Object.keys(userPhUsage)) setY.add(parseInt(k.split('-')[0]));
      let html = "";
      Array.from(setY).sort((a,b)=>b-a).forEach(y => {
        html += `<button class="btn-year-chip ${y===selectedSummaryYear?'active':''}" onclick="selectSummaryYear(${y})">${y} 年</button>`;
      });
      document.getElementById("phYearChipsContainer").innerHTML = html;
    }
    window.selectSummaryYear = (y) => { selectedSummaryYear = y; renderPhYearChips(); updatePhStatistics(); };

    function updatePhStatistics() {
      let tH = 0;
      for (const [k, v] of Object.entries(userPhUsage)) if(k.startsWith(`${selectedSummaryYear}-`)) tH += v;
      document.getElementById("summaryYearTitle").innerText = `${selectedSummaryYear} 年`;
      document.getElementById("phStatTotalHours").innerText = `${tH} 小時`;
      document.getElementById("phStatTotalDays").innerText = `${(tH/8).toFixed(2)} 日`;
    }

    // 帳戶修改
    window.openChangeAccountModal = () => { document.getElementById("accountModal").style.display="flex"; };
    window.closeAccountModal = () => document.getElementById("accountModal").style.display="none";
  </script>
</head>
<body>

  <!-- 登入面板 (還原為圖2經典樣式) -->
  <div class="auth-container" id="authPanel" style="display:none;">
    <input type="text" id="authUsername" placeholder="帳戶名稱 (例如: peter888)">
    <input type="password" id="authPassword" placeholder="密碼 (最少6位)">
    
    <div id="staffIdField" style="display:none; width:100%; margin:4px 0;">
      <input type="text" id="authStaffId" placeholder="員工編號 (例如: E12345)" style="border: 2px solid #e67e22;">
      <div style="font-size:0.75rem; color:#7f8c8d; text-align:left; padding-left:5px; line-height:1.4;">
        * 每個員工編號綁定一個帳號。<br>
        * 若忘記帳號或密碼，可憑此員工編號隨時重設帳戶名稱及新密碼（原有更期資料會自動保留遷移）。
      </div>
    </div>

    <button class="btn-auth" id="submitAuthBtn" onclick="submitUserAuth()">登入</button>
    
    <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:0.82rem;">
      <span class="auth-toggle" id="forgotBtn" style="margin:0; color:#e67e22;" onclick="toggleForgotMode()">忘記密碼？</span>
      <span class="auth-toggle" id="toggleBtn" style="margin:0;" onclick="toggleAuthMode()">未有帳號？點此註冊</span>
    </div>

    <hr style="border:0; border-top:1px solid #eee; margin:15px 0 10px;">

    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#ffffff" d="M12.24 10.285V13.4h6.887C18.2 16.14 15.645 18 12.24 18c-3.315 0-6-2.685-6-6s2.685-6 6-6c1.47 0 2.805.54 3.84 1.425l2.385-2.385C16.98 3.555 14.73 2.7 12.24 2.7 7.155 2.7 3 6.855 3 11.94s4.155 9.24 9.24 9.24c5.325 0 8.865-3.75 8.865-9.03 0-.615-.06-1.2-.165-1.755H12.24z"/></svg>
      Google 一鍵登入
    </button>
    <div id="authMsg" style="color:#e74c3c; font-size:0.85rem; margin-top:10px; font-weight:bold;"></div>
  </div>

  <!-- 主介面 -->
  <div id="appPanel" style="display:none;">
    <!-- 頂部欄 -->
    <div class="top-header">
      <div class="top-row">
        <!-- 醒目日期選擇器 -->
        <div class="month-title">
          <input type="date" id="headerDatePicker" onchange="jumpToSpecificDate(this.value)">
        </div>
        <div class="top-right">
          <button class="btn-today" onclick="jumpToToday()">今天</button>
          <div class="profile-icon" id="profileIcon" onclick="openChangeAccountModal()" title="點擊修改帳號/登出">U</div>
        </div>
      </div>
      <!-- 水平導航列 (可左右滑動) -->
      <div class="nav-links">
        <a href="calc.html">📅 大假推算</a>
        <a href="dinner.html">🍽️ 多人約食飯對照</a>
        <a href="swap.html">🔄 實體更表與調更</a>
      </div>
    </div>

    <!-- 月份導航 (無限延伸 Pill Scroll) -->
    <div class="month-scroller" id="monthScroller"></div>

    <!-- 月曆網格區 -->
    <div class="calendar-wrapper">
      
      <!-- ★ 極致壓縮版設定橫條 ★ -->
      <div class="setup-bars-container">
        <!-- 1. 快速導入：今日 -->
        <div class="quick-setup-bar">
          <b style="color: var(--gc-blue); white-space: nowrap;">📍今日:</b>
          <select id="quickGroupSelect" class="setup-select" onchange="updateQuickRowSelect(this.value)">
            <option value="group2">2組</option>
            <option value="group3" selected>3組</option>
            <option value="group4">4組</option>
            <option value="groupCell">Cell組</option>
          </select>
          <select id="quickRowSelect" class="setup-select"></select>
          <button onclick="quickApplyToday()" class="btn-quick-nav" style="background:var(--gc-blue);">🚀 推算</button>
        </div>

        <!-- 2. 指定日期換組/插旗 -->
        <div class="anchor-setup-bar">
          <b style="color: #8e44ad; white-space: nowrap;">🚩插旗:</b>
          <input type="date" id="anchorDateInput" value="2026-10-05" class="setup-select">
          <select id="anchorGroupSelect" class="setup-select" onchange="onAnchorGroupChange(this.value)">
            <option value="group2">2組</option>
            <option value="group3" selected>3組</option>
            <option value="group4">4組</option>
            <option value="groupCell">Cell組</option>
          </select>
          <select id="anchorRowSelect" class="setup-select"></select>
          <button onclick="setManualAnchorAtDate()" class="btn-quick-nav" style="background:#8e44ad;">套用</button>
        </div>
      </div>

      <div id="unifiedCalendarGrid"></div>

      <!-- 重置與 PH 統計區 -->
      <div style="margin-top: 30px; padding-top: 20px; border-top: 2px dashed #d7bde2;">
        
        <div style="display:flex; justify-content:flex-end; margin-bottom:15px;">
          <button onclick="resetYearShiftsAndPh()" style="background:#e74c3c; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold; box-shadow:0 2px 5px rgba(231,76,60,0.3);">
            🔄 重置今年所有已導入更期
          </button>
        </div>

        <div style="font-weight:bold; color:#6c3483; font-size:0.95rem; margin-bottom: 10px;">
          📊 歷年 PH 統計（點擊年份切換）：
        </div>
        
        <div class="ph-year-chips-bar" id="phYearChipsContainer" style="justify-content: flex-start; margin-bottom: 10px;"></div>
        
        <div style="background:#f4ecf7; border: 1.5px solid #d7bde2; border-radius:10px; padding:20px; display:flex; justify-content:space-around; align-items:center; text-align:center;">
          <div>
            <div style="font-size:0.85rem; color:#7d3c98;" id="summaryYearTitle">2026 年</div>
            <div style="font-size:0.85rem; color:#555; margin-top:4px;">已用總時數</div>
            <div style="font-size:1.6rem; font-weight:bold; color:#6c3483; margin-top:4px;" id="phStatTotalHours">0 小時</div>
          </div>
          <div>
            <div style="font-size:0.85rem; color:#7d3c98;">折合總日數 (8h=1日)</div>
            <div style="font-size:1.6rem; font-weight:bold; color:#c0392b; margin-top:4px;" id="phStatTotalDays">0.00 日</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 調更與 PH Modal -->
  <div id="combinedModal" class="modal-overlay">
    <div class="modal-card">
      <h3 class="modal-title" id="modalDateTitle">📅 日期</h3>
      
      <div class="modal-section">
        <label>扣減 PH 時數</label>
        <select class="select-block" id="phHourSelect">
          <option value="0">0 小時</option><option value="1">1 小時</option><option value="2">2 小時</option>
          <option value="3">3 小時</option><option value="4">4 小時</option><option value="5">5 小時</option>
          <option value="6">6 小時</option><option value="7">7 小時</option><option value="8">8 小時</option>
        </select>
      </div>

      <div class="modal-section">
        <label>手動調更 / 單日大假</label>
        <select class="select-block" id="modalShiftSelect"></select>
        <button class="btn-modal btn-danger" onclick="document.getElementById('modalShiftSelect').value='AL'">🏖️ 設為單日 AL</button>
      </div>

      <div class="modal-section">
        <label>個人備註</label>
        <input type="text" id="modalNoteInput" placeholder="輸入備註..." class="select-block">
      </div>

      <div class="modal-btns">
        <button class="btn-modal btn-cancel" onclick="closeCombinedModal()">取消</button>
        <button class="btn-modal btn-save" onclick="saveCombinedData()">儲存</button>
      </div>
    </div>
  </div>

  <!-- 修改帳號 Modal -->
  <div id="accountModal" class="modal-overlay">
    <div class="modal-card">
      <h3 class="modal-title">🔑 修改帳號與密碼</h3>
      <div class="modal-section">
        <label>帳戶名稱：</label>
        <input type="text" id="editUsernameInput" class="select-block">
      </div>
      <div class="modal-section">
        <label>新密碼 (不改請留空)：</label>
        <input type="password" id="editPasswordInput" class="select-block">
      </div>
      <div id="editAccountMsg" style="color:#d32f2f; font-size:0.85rem; font-weight:bold; margin-bottom:10px;"></div>
      <div class="modal-btns" style="flex-wrap:wrap;">
        <button class="btn-modal btn-save" style="width:100%;" onclick="submitAccountUpdate()">確認修改</button>
        <button class="btn-modal btn-danger" onclick="userLogout()">登出帳號</button>
        <button class="btn-modal btn-cancel" style="width:100%; text-align:center;" onclick="closeAccountModal()">返回</button>
      </div>
    </div>
  </div>

</body>
</html>
